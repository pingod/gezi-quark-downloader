name: release

# 打 tag（v*）即发版：构建 Linux AppImage + 自包含 tar.gz，上传到对应的 GitHub Release。
#
# 为什么单独一个工作流，而不是在 linux.yml 里加个 if：
#   linux.yml 的门槛是「每次 push/PR 都要过」；发版要多做三件有副作用的事
#   （创建 Release、上传资产、写发布说明）。把副作用和门禁分开，
#   PR 永远不会误发版，发版失败也不会让门禁变红。
#
# ⚠️ 本工作流只出 **Linux** 资产。Windows（WPF/net48）那条线由 build.yml 负责构建，
#    其发布包目前仍需手工上传 —— 两者版本号各自独立，不要用一个 tag 假装覆盖两个平台。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例如 v2.5.0）'
        required: true

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成发布说明要 diff 上一个 tag，浅克隆拿不到 tag 历史
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "tag 必须以 v 开头: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # 版本号一致性：AppImage 包名、程序集版本、Release 标题都取自这里，
      # 三者对不上会让用户拿到一个「文件名说 2.5.0、程序里说 2.3.1」的包。
      - name: Verify version matches tag
        run: |
          set -e
          want="${{ steps.tag.outputs.version }}"
          csproj="$(sed -n 's:.*<Version>[[:space:]]*\([^<[:space:]]*\)[[:space:]]*</Version>.*:\1:p' \
            src/GeZi.Avalonia/GeZi.Avalonia.csproj | head -1)"
          manifest="$(sed -n 's:.*<assemblyIdentity version="\([0-9.]*\)".*:\1:p' \
            src/GeZi.Avalonia/app.manifest | head -1)"
          echo "tag=$want  csproj=$csproj  manifest=$manifest"
          [ "$want" = "$csproj" ] || { echo "csproj 版本 $csproj ≠ tag $want" >&2; exit 1; }
          case "$manifest" in
            "$want".*) ;;
            *) echo "app.manifest 版本 $manifest 与 tag $want 不匹配" >&2; exit 1 ;;
          esac

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/GeZi.Avalonia/GeZi.Avalonia.csproj -r linux-x64

      - name: Publish (self-contained linux-x64)
        run: >
          dotnet publish src/GeZi.Avalonia/GeZi.Avalonia.csproj -c Release -f net8.0
          -r linux-x64 --self-contained true --no-restore -o publish
          -p:ContinuousIntegrationBuild=true

      - name: Smoke (layout + linkage)
        run: |
          set -e
          test -x publish/GeZi.Avalonia
          file publish/GeZi.Avalonia | grep -q 'ELF 64-bit'
          test -f publish/libcoreclr.so
          test -f publish/GeZi.Avalonia.dll
          ! ldd publish/GeZi.Avalonia | grep -q 'not found'

      # AppImage：脚本内部组装 AppDir、剔除 PDB、解包回验（apphost/libcoreclr/
      # desktop/.DirIcon/ldd）、算 SHA-256。appimagetool 版本钉死并校验哈希。
      - name: Package (AppImage)
        run: tools/package_appimage.sh --publish-dir publish --out artifacts

      - name: Package (tar.gz + SHA256)
        run: |
          set -e
          mkdir -p artifacts
          cp LICENSE THIRD-PARTY-NOTICES.md artifacts/
          cp -r publish artifacts/GeZi-linux-x64
          tar -C artifacts -czf artifacts/GeZi-linux-x64.tar.gz GeZi-linux-x64
          sha256sum artifacts/GeZi-linux-x64.tar.gz | sed 's|artifacts/||' \
            > artifacts/GeZi-linux-x64.tar.gz.sha256
          ls -lh artifacts

      # Arch 包：pacman 可直接 -U 安装，自包含运行时。
      # 打包脚本要 makepkg；ubuntu runner 没有，脚本会自动走
      # archlinux:base-devel 容器（runner 自带 docker）。
      - name: Package (Arch pkg.tar.zst)
        run: tools/package_arch.sh --publish-dir publish --out artifacts

      # 发布说明从 git 历史生成：tag 之间的提交标题就是变更列表。
      # 不写「本次优化了性能」这种无法复核的话 —— 用户能对着 commit 核对。
      - name: Build release notes
        id: notes
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"

          APPIMAGE="$(basename artifacts/GeZi-*-x86_64.AppImage)"
          APP_SHA="$(cut -d' ' -f1 "artifacts/$APPIMAGE.sha256")"
          TAR_SHA="$(cut -d' ' -f1 artifacts/GeZi-linux-x64.tar.gz.sha256)"
          ARCHPKG="$(basename artifacts/gezi-downloader-*-x86_64.pkg.tar.zst)"
          ARCH_SHA="$(cut -d' ' -f1 "artifacts/$ARCHPKG.sha256")"

          {
            echo "## 鸽子下载 ${TAG} — Linux 原生版"
            echo
            echo "单文件 AppImage：下载后 \`chmod +x\` 再双击即可运行，**不需要安装 .NET 运行时**。"
            echo
            if [ -n "$PREV" ]; then
              echo "### 变更（$PREV..$TAG）"
              echo
              git log --no-merges --pretty='- %s' "$PREV..$TAG"
            else
              echo "### 变更"
              echo
              git log --no-merges --pretty='- %s' -20 "$TAG"
            fi
            echo
            echo "### 下载"
            echo
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| \`$APPIMAGE\` | 单文件 AppImage，免安装 |"
            echo "| \`$ARCHPKG\` | Arch Linux 包（\`sudo pacman -U $ARCHPKG\`） |"
            echo "| \`GeZi-linux-x64.tar.gz\` | 自包含目录，解压即用（适合自己做启动器/装到 /opt） |"
            echo
            echo "\`\`\`"
            echo "sha256  $APP_SHA  $APPIMAGE"
            echo "sha256  $ARCH_SHA  $ARCHPKG"
            echo "sha256  $TAR_SHA  GeZi-linux-x64.tar.gz"
            echo "\`\`\`"
            echo
            echo "### 系统要求"
            echo
            echo "- Linux x86-64，glibc ≥ 2.27（Ubuntu 18.04+ / Debian 10+ / Fedora 30+）"
            echo "- Wayland 或 X11 桌面会话"
            echo "- 中文字体（\`noto-fonts-cjk\` 等），否则界面显示方块"
            echo "- 可选：VLC 或 mpv（仅「边下边播」需要）"
            echo "- 托盘图标依赖桌面环境的 StatusNotifier 支持；不支持的桌面上关窗即退出"
            echo
            echo "> AppImage 需要 FUSE。若系统没有 \`libfuse2\`，用"
            echo "> \`./$APPIMAGE --appimage-extract-and-run\` 运行，或直接下 tar.gz。"
            echo
            echo "许可证：AGPL-3.0"
          } > notes.md

      - name: Create / update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              artifacts/GeZi-*-x86_64.AppImage \
              artifacts/GeZi-*-x86_64.AppImage.sha256 \
              artifacts/gezi-downloader-*-x86_64.pkg.tar.zst \
              artifacts/gezi-downloader-*-x86_64.pkg.tar.zst.sha256 \
              artifacts/GeZi-linux-x64.tar.gz \
              artifacts/GeZi-linux-x64.tar.gz.sha256 \
              --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" \
              artifacts/GeZi-*-x86_64.AppImage \
              artifacts/GeZi-*-x86_64.AppImage.sha256 \
              artifacts/gezi-downloader-*-x86_64.pkg.tar.zst \
              artifacts/gezi-downloader-*-x86_64.pkg.tar.zst.sha256 \
              artifacts/GeZi-linux-x64.tar.gz \
              artifacts/GeZi-linux-x64.tar.gz.sha256 \
              --title "鸽子下载 ${TAG} — Linux 原生版" \
              --notes-file notes.md
          fi
